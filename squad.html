<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 1. NavBar -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

            <div class="navbar_input squad">

            <div class="navbar_input shop">

            </div>
            <div class="navbar_input tickets">

        </div>

          <a href="#"

        </div>
        <div class="navbar_inputs">
          <div class="navbar_inputs-container">
            <div class="navbar_input home">

            </div>
            <div class="navbar_input new">
              <a href="#"><p>News</p></a>
            </div>

            </div>
            <div class="navbar_input shop">

            <div class="navbar_input tickets">

            </div>

            <button onclick="showDropdownMain()">
              <i data-lucide="user-round"></i>
            </button>
          </div>
          <div id="navDropdownMain" class="navbar_sign-dropdown">

              <a href="login.html"><p>Sign In</p></a>
            </div>
            <div class="navbar_sign-dropdown-reg">
              <a href="signin.html"><p>Register</p></a>
            </div>
          </div>
        </div>
        <div class="navbar_menu-icon">
          <i onclick="showSidebar()" data-lucide="menu"></i>

      </div>
