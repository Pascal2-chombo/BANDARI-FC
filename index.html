<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body>
    <!-- Navigation bar section -->
    <nav class="navbar">
      <div class="navbar_container">
        <div class="navbar_logo">
          <a href="#"
            ><img src="assets/images/BANDARI-FC-Logo.png" alt="logo"
          /></a>
        </div>
        <div class="navbar_inputs">
          <div class="navbar_inputs-container">
            <div class="navbar_input home">
              <a href="#"><p>Home</p></a>
            </div>
            <div class="navbar_input news">
              <a href="#"><p>News</p></a>
            </div>
            <div class="navbar_input squad">
              <a href="#"><p>Squad</p></a>
            </div>
            <div class="navbar_input shop">
              <a href="#"><p>Shop</p></a>
            </div>
            <div class="navbar_input tickets">
              <a href="#"><p>Tickets</p></a>
            </div>
          </div>
        </div>
        <div class="navbar_sign">
          <div class="navbar_sign-icon">
            <button onclick="showDropdown()">
              <i data-lucide="user-round"></i>
            </button>
          </div>
          <div id="navDropdown" class="navbar_sign-dropdown active">
            <div class="navbar_sign-dropdown-sign">
              <a href="login.html"><p>Sign In</p></a>
            </div>
            <div class="navbar_sign-dropdown-reg">
              <a href="signin.html"><p>Register</p></a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <script>
      lucide.createIcons();
      // To enable dropdown for navbar on signIn

      const navDropdown = document.getElementById("navDropdown");

      function showDropdown() {
        navDropdown.classList.toggle("active");
      }
    </script>
  </body>
</html>
