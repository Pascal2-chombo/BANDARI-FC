<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>Administrator Dashboard</title>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <!-- 1. Side Bar Menu -->
    <div class="sidebar_container" id="sideBar">
      <div class="sidebar_top">
        <img src="assets/images/BANDARI-FC-Logo.png" alt="">
      </div>
      <div class="sidebar_tabs">
        <div class="dashboard">
          <h3>Dashboard</h3>
        </div>
        <div class="finance">
          <h3>Finance Management</h3>
        </div>
        <div class="coach">
          <h3>Player Management</h3>
        </div>
        <div class="coach">
          <h3>Staff Management</h3>
        </div>
        <div class="news">
          <h3>News</h3>
        </div>
        <div class="shop">
          <h3>Shop</h3>
        </div>
        <div class="tickets">
          <h3>Tickets</h3>
        </div>
      </div>
    </div>
    <!-- 2. Main Content -->

    <div class="main_container">
      <!-- 2.1 Top Menu -->
      <div class="header_container">
        <div class="close_btn">
          <i data-lucide="menu" onclick="hideSidebar()"></i>
        </div>
        <div class="header_search">
          <div class="search_bar">
            <input type="text" />
          </div>
          <div class="search_btn">
            <i data-lucide="search"></i>
          </div>
        </div>
        <div class="header_profile" id="profileDropdown">
          <div class="profile_content">
            <p>Welcome,</p>
          </div>
          <div class="profile">
            <i data-lucide="user-round"></i>
            <span class="profile_online"></span>
          </div>
          <div class="profile_dropdown">
            <div class="dropdown_content top">
              <i data-lucide="circle-user-round"></i>  
              <p>Reset Password</p>
            </div>
            <div class="dropdown_content">
              <i data-lucide="log-out"></i> 
              <p>Log Out</p>
            </div>
          </div>
        </div>
      </div>
      <!-- 2.2 Content -->
      <div class="content_container"></div>
    </div>

    <script>
      lucide.createIcons();

      // 

      const sideBar = document.querySelector(".sidebar_container");
      const mainContainer = document.querySelector(".main_container");

      function hideSidebar() {
        if ((sideBar.style.width === "20vw")) {
          sideBar.style.width = "8vw";
          mainContainer.style.width = "92vw";
        } else {
          sideBar.style.width = "20vw";
          mainContainer.style.width = "80vw";
        }
      }


      // Pop up Profile Dropdown

      const profileDropdown = document.getElementById("profileDropdown");
      const dropDown = document.querySelector('.profile_dropdown');

      profileDropdown.addEventListener("click", function(){
        dropDown.classList.toggle("show")
      })

    </script>
  </body>
</html>
